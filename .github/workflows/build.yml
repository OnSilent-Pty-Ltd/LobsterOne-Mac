name: Build & Test

on:
  push:
    branches: [main]
    # A push that only changes Markdown skips Build & Test, and so skips the release that
    # follows it: a README edit shouldn't auto-update every Mac.
    paths-ignore: ['**.md']
  pull_request:
    branches: [main]
  # "Run workflow" in the Actions tab. Run on main, a pass also starts a release.
  workflow_dispatch:

# Builds and tests only; nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode 26
        # Dictation uses SpeechAnalyzer, which is only in the macOS 26 SDK; the runner's
        # default Xcode is 16.4.
        run: sudo xcode-select -s /Applications/Xcode_26.3.app

      - name: Check SPM ↔ Xcode source sync
        run: |
          # Ensure Sources/LobsterOne/ and LobsterOne/LobsterOne/ are identical
          # (excluding Xcode-only files: Assets, Info.plist, entitlements, Resources)
          DIFF=$(diff -rq Sources/LobsterOne/ LobsterOne/LobsterOne/ \
            --exclude="*.xcassets" --exclude="Info.plist" --exclude="*.entitlements" --exclude="Resources" 2>&1 || true)
          if [ -n "$DIFF" ]; then
            echo "❌ SPM and Xcode project sources are out of sync!"
            echo ""
            echo "$DIFF"
            echo ""
            echo "Fix: copy changed files between Sources/LobsterOne/ and LobsterOne/LobsterOne/"
            exit 1
          fi
          echo "✅ SPM and Xcode sources are in sync"

      - name: Build (Xcode)
        run: |
          xcodebuild build \
            -project LobsterOne/LobsterOne.xcodeproj \
            -scheme LobsterOne \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (SPM)
        run: swift test
